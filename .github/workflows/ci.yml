name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone holo fork at pin
        run: |
          git clone --quiet https://github.com/shkolnik/holo.git ../holo
          git -C ../holo checkout --quiet $(cat holo.rev)
      - name: Install libyang build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential libpcre2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Holo pin and feature guard
        run: bash scripts/holo-check.sh
      - name: Fork socket tests (control-mark order is a fork invariant cfab depends on)
        # yang5/bundled: the holo workspace links the system libyang by default, which the
        # runner (and any dev box without it) lacks; cfab itself always builds it bundled.
        run: cargo test --manifest-path ../holo/Cargo.toml -p holo-utils --lib --features yang5/bundled socket
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Man page lint
        # groff -z exits 0 even on warnings; fail on any diagnostic output.
        run: |
          sudo apt-get install -y --no-install-recommends groff
          out=$(groff -man -z doc/cfab.8 2>&1)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  deb:
    # On main pushes the release workflow builds and publishes the deb;
    # this job proves packaging before merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone holo fork at pin
        run: |
          git clone --quiet https://github.com/shkolnik/holo.git ../holo
          git -C ../holo checkout --quiet $(cat holo.rev)
      - name: Install libyang build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential libpcre2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Holo pin and feature guard
        run: bash scripts/holo-check.sh
      - name: Install cargo-deb
        # +stable: rustup otherwise warns that rust-toolchain.toml overrides the
        # default toolchain for the install; the version is pinned so a
        # cargo-deb release cannot change the package under us.
        run: cargo +stable install --locked cargo-deb@3.8.0
      - name: Build Debian package
        # glibc deb for the bake-off; a static musl build is a post-decision
        # size measurement (spec §11).
        run: cargo deb
      - uses: actions/upload-artifact@v7
        with:
          name: cfab-deb
          path: target/debian/*.deb
