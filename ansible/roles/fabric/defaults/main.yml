# shkolnik.cfab.fabric — defaults. The binary comes from the apt repository. The declaration is the
# operator's: `cfab_declaration` (REQUIRED, no default) is the path, on the control node, of the
# fabric.toml this host gets. Nothing about any particular site lives in this role.
cfab_declaration: ""

# The wires the read-only probe inspects. Default: every `nic = "..."` in the declaration.
cfab_nics: "{{ lookup('file', cfab_declaration) | regex_findall('nic\\s*=\\s*\"([^\"]+)\"') | unique | join(' ') }}"

# apt repository (pkg.jshkol.com serves signed metadata; the .deb bytes are a 302 to GitHub
# Releases). The sources line is the one documented at https://pkg.jshkol.com.
cfab_apt_uri: https://pkg.jshkol.com
cfab_apt_suite: stable
cfab_apt_component: main
cfab_keyring_asc_path: /usr/share/keyrings/jshkol-archive-keyring.asc
cfab_keyring_path: /usr/share/keyrings/jshkol-archive-keyring.gpg

# Empty = whatever the repository offers (`state: present` never upgrades an installed package,
# so this only bites on a first install). Set to e.g. "0.1.0-1" to pin.
cfab_version: ""

# --tags apply arms a timed revert BEFORE bringup: unless `--tags disarm` runs within this many
# minutes the host tears the fabric down and disables the unit by itself.
cfab_revert_minutes: 10
# How long `cfab status --wait` waits for UP after bringup (needs cfab >= 0.2.0: `status`).
cfab_status_wait: 90
# Generated by the role (the deb ships no maintainer scripts); what the timer and --tags rollback run.
cfab_revert_script: /usr/local/sbin/cfab-revert
