# Rollback now = what the timer would do: disable the unit, `cfab down`. The package stays installed.
- name: Stop the revert timer
  command: systemctl stop cfab-revert.timer
  changed_when: false
  failed_when: false

- name: cfab-revert
  command: "{{ cfab_revert_script }} manual"
  register: cfab_revert
  changed_when: true

- name: Rollback output
  debug:
    msg: "{{ (cfab_revert.stdout ~ '\n' ~ cfab_revert.stderr).split('\n') }}"
