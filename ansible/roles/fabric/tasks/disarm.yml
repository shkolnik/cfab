# Disarm = keep the fabric: stop the revert timer. Says so if there was none (it may have fired).
- name: Stop the revert timer
  command: systemctl stop cfab-revert.timer
  register: cfab_disarm
  changed_when: cfab_disarm.rc == 0
  failed_when: false

- name: Fabric state
  command: systemctl is-active cfab.service
  register: cfab_active
  changed_when: false
  failed_when: false

- name: Disarm report
  debug:
    msg: >-
      {{ inventory_hostname }}: {{ 'revert timer stopped' if cfab_disarm.rc == 0
         else 'NO revert timer was armed (already fired, or never applied)' }};
      cfab is {{ cfab_active.stdout }}.
