# cfab kernel routing-table names (iproute2 rt_tables.d), matching src/commands/common.rs
# HOST_DEFAULT_TABLE / HOST_DEFAULT_TABLE_NAME. Table 250 holds exactly one route: the
# additive host default cfab adds while it is up (spec §6), reached by ip rule pref 2101.
# Purely cosmetic for `ip route show` and `ip rule show`; cfab addresses the table by its
# number, never by this name, so a host without this file behaves identically.
250	cfab-default
