# fabric.conf — the fabric declaration
#
# Four tables declare the fabric: DOMAINS (the physical switch domains), MEMBER_TABLE (who is
# in it, on which wires), ZONE_TABLE (the traffic classes) and SEGMENT_TABLE (each zone's
# segments: one VLAN per zone x domain). WIRE_PREF optionally overrides one member's wire
# order for one zone.
# Everything else — sub-interfaces, addressing, OSPF/BFD, the nft forward policy, packet
# marking, HTB shaping, BGP ingress — is generated from them.
#
# The file is shell syntax by design: `sh` can source it, so shell tooling can share the
# declaration. cfab reads only the literal KEY=value assignments; anything the shell would
# compute ($(…), ${…}, functions) is ignored and re-derived internally.
#
# Addressing: each zone owns the block 10.<id>.0.0/16. A member's stable identity in the
# zone is 10.<id>.0.<node>/32 on its own netdev; its address on segment s is
# 10.<id>.<s>.<node>/24. VLAN ids belong to SEGMENTS (the SEGMENT_TABLE vid column), one id
# per segment, so a mis-cabled or hub-connected switch can never silently merge two
# segments.
#
# This example is the declaration of a real three-member fabric (two Proxmox hosts and one
# leaf) whose failure behavior was measured live: cable pulls, switch power loss, driver
# resets, line-rate saturation.

# Fabric mode; "tagged" (VLAN sub-interfaces + PCP, a switch port carries its wire's
# segments tagged) is the only supported mode.
FABRIC_MODE=tagged

# ---- DOMAINS: the physical switch domains ----------------------------------------------
# Opaque DECLARED tokens, one ASCII letter each. Declared rather than inferred so a typo in a
# wire's or a segment's domain is an error and not a phantom domain; the check is
# two-directional (a declared domain no member wires into is an error too). The token is also
# the suffix of every bond-leg slave (<ifname>-<domain>), which is why it is one character.
DOMAINS="a b c"          # a = 5G/10G storage switch, b = 1G switch, c = 1G admin switch

# ---- MEMBERS: who is in the fabric, on which wires ------------------------------------
# One row per member:
#   host = transits between zones, shapes its wires, carries every domain it has wires on;
#   leaf = own identity + OSPF/BFD on the domains it has, but stub: never transits, no
#          shaping, and its untagged/externally-managed L3 is never touched (e.g. a NAS
#          whose OS the fabric must not own).
# wire@domain:speed = this member's NIC, the DOMAINS token it is plugged into, and its
# DECLARED link speed in Mb/s. One wire is pinned to exactly ONE domain: a single NIC into a
# single switch IS one domain. Declare as many wires as the member has, in preference-tiebreak
# order (equal speeds keep this order). The observed ethtool speed is only cross-checked
# (`verify` warns): USB NICs often misreport, and a down link reports "Unknown".
# On a HOST the untagged path of EVERY wire is the admin plane (SSH, GUI, DHCP): the fabric
# never owns its L3 state, it never transits, and each wire gets its own ADMIN_FLOOR band. A
# leaf treats every wire that way and owns none of it.
# Columns: member  node  kind  wire@domain:speed ...
MEMBER_TABLE="
pve1-tb 1 host eth9@a:5000 eth1@b:1000 eth0@c:1000
pve2-tb 2 host eth9@a:5000 eth1@b:1000 eth0@c:1000
pve3-tb 3 leaf eth9@a:10000 eth1@b:1000 eth0@c:1000
"

# DNS domain under which identities are named: <member>.<zone>.<FABRIC_DOMAIN>
# (reserved: name resolution for identities is declared here but not generated yet)
FABRIC_DOMAIN=fabric.example

# ---- ZONES: the traffic classes -------------------------------------------------------
# Columns: zone  id  pcp  dscp  floor  band  weight  primary  gw
#   id     = the zone's number: OSPF instance, identity netdev cfab-id<id>, address block
#            10.<id>.0.0/16. NOT a VLAN id (segments carry those, below).
#   pcp    = 802.1p priority for the zone's traffic (sub-interface egress-qos-map 0:pcp).
#            This member's own OSPF/BFD leave at PCP_CTRL / DSCP CS6 whatever the zone
#            carries: the engine sets both on its sockets.
#   dscp   = the DSCP class a queueing switch sees (cs0|cs2|cs6 — a closed set: extend it
#            only with measured switch-queue behavior behind the new value).
#   floor  = MINIMUM Mb/s guarantee for the zone's HTB band; band/weight = which HTB prio
#            band (0 = control … 2 = bulk) and the quantum ratio within a shared band.
#   primary= the DOMAINS token whose segment is this zone's rank-0 (primary) wire on every
#            member that has a wire there. The one part of path preference that IS
#            physical-layout policy, so it is declared globally; ranks below it are derived
#            from declared link speed (descending, MEMBER_TABLE order on a tie). Keeping the
#            three zones on three different primaries is what makes one switch failure cost
#            one zone its healthy path instead of all three.
#   gw     = where the OUTSIDE enters this zone: domain:vid:router/24, "any" in place of
#            a domain, or "-" = no ingress. The ingress VLAN is router-owned and DISTINCT
#            from every fabric segment: the router never holds an address inside a segment
#            and never sees its OSPF/BFD. Each host with a wire on that island carries the
#            leg cfab-gw<id> — tagged <vid> on that wire, addressed <router's /24>.<node>, no
#            OSPF adjacency, no BFD — and one iBGP session to the router; the leg is
#            passive-advertised in the zone's OSPF instance so a peer can transit for a
#            host whose own leg is down. Leaves never peer (they never transit).
#            "any" makes the leg MIGRATE instead of dying with its domain: it
#            becomes the same active-backup bond a universal segment is (cfab-gw<id> over
#            cfab-gw<id>-<domain> per wire), homed on the wire carrying that zone's
#            cheapest segment. One leg and one BGP session either way. RACK PRECONDITION,
#            not yet met: <vid> must be tagged on EVERY domain's ports (and per-port storm
#            control enabled) before "any" is declared here — until then this row stays
#            "c:", because a tag missing on a domain silently blackholes that slave.
#            Return path: traffic sourced from the zone's block is routed in main WITHOUT
#            main's default route; what main cannot route goes to the zone's own table,
#            whose default is the router (recursive: the leg while up, else a peer's
#            OSPF-advertised leg) or `reject`. Either way nothing sourced from a fabric
#            block ever leaves through the untagged admin path.
# mgmt: members stay reachable when ANY NIC is connected; the untagged admin address on
# every wire stays beside it as the routing-protocol-independent lifeline.
ZONE_TABLE="
storage  99 0 cs0 2000 2 4 a -
cluster 199 6 cs6  200 0 1 b -
mgmt    249 2 cs2  100 1 1 c c:249:192.168.249.254/24
"

# ---- SEGMENT TABLE: one segment per row — the single source of truth ------------------
# Every per-interface artifact is derived from this table and nothing else: sub-interface
# creation, OSPF interface blocks, rp_filter, the nft forward-policy zones, per-interface
# forwarding enables, the HTB floor trees, the switch VLAN list.
# Columns: ifname  domain|any  zone  seg  vid
# A row is a SEGMENT: zone z on switch domain d, addressed 10.<id>.<seg>.<node>/24, tagged
# <vid> on that domain's switch. vid is unique per row: the same tag never means two segments.
# The domain resolves to each member's wire via MEMBER_TABLE; a member with no wire on a
# domain simply has no rows there — heterogeneity is generated, not branched.
# A segment carries NO role and NO cost: the role is the scope ("any" = universal) and the
# cost is DERIVED. Each member ranks its own wires per zone — rank 0 = the wire on that zone's
# `primary` domain, then the rest by declared speed descending (MEMBER_TABLE order on a tie),
# or the whole order from a WIRE_PREF row — and the rank becomes the OSPF cost on the ladder
# rank 0 -> 10, rank r -> 100*r. Two hops over rank-0 wires (20) therefore still beat any
# one-hop backup (100).
# UNIVERSAL rows (domain `any`) are the exception: one per zone, addressed and vid-tagged like
# a segment, but not a per-domain row. `any` means "every wire this member has": the derive
# layer fans it out into an active-backup bond over every wire, one VLAN sub-interface per
# wire as a slave (named <ifname>-<domain>), homed on the zone's rank-0 wire, so a preference
# change re-homes the bond. No BFD on it (it exists only when already degraded; OSPF's 3 s
# dead interval is its detector, like the ingress leg). Its cost is derived too: the zone's
# longest host path (the sum of its domain segments' costs) plus one ladder step — above every
# real host path and below LEAF_COST_OFFSET, which is now the only knob if that ceiling binds.
# Switch precondition (James's hands, not yet done): per-port storm control on every
# domain before these VIDs are enabled — a universal-segment storm would share PCP with
# per-domain BFD on every port it reaches. And a universal vid must be tagged on every domain's
# access ports AND end to end across the inter-switch links: one universal vid is ONE broadcast
# domain spanning every switch domain, and a per-domain fragment of it leaves the bond's carrier
# check passing on a slave whose tag reaches nobody.
SEGMENT_TABLE="
cfab-st     a   storage 1 100
cfab-st-bk  b   storage 2 101
cfab-st-b2  c   storage 3 102
cfab-cl     b   cluster 1 200
cfab-cl-bk  a   cluster 2 201
cfab-cl-b2  c   cluster 3 202
cfab-mg     c   mgmt    1 250
cfab-mg-bk  b   mgmt    2 251
cfab-mg-b2  a   mgmt    3 252
cfab-st-fb  any storage 9 300
cfab-cl-fb  any cluster 9 301
cfab-mg-fb  any mgmt    9 302
"
# Optional per-(member, zone) preference OVERRIDE: the member's wires carrying that zone, in
# order, COMPLETE (every such wire listed exactly once — a partial list is an error, never
# blended with the derived order). Absent row = derived. Overrides are marked in `cfab gen
# prefs` and in `cfab status`.
# Columns: member  zone  wire ...
# WIRE_PREF="
# pve1-tb storage eth1 eth9 eth0
# "

# Keep segment vids DISJOINT from any native/untagged VLAN the same ports carry: a switch
# forwards an id as native XOR tagged per port, so reusing a native id as a segment vid
# silently kills the segment on that port (measured, the hard way).
# A LEAF's links are advertised at derived cost + LEAF_COST_OFFSET, applied only to the
# leaf's own interfaces: a path THROUGH the leaf costs ~= the offset plus the two interface
# costs it crosses (INFERRED, RFC 2328 §16.1, not measured) — still far beyond every
# host-to-host path — so no host ever routes via the leaf even when its own wires are mostly
# gone, while the leaf's OWN preferences (the cost differences) survive intact. This replaces
# RFC 6987 `max-metric router-lsa administrative`, which FRR also applies to the stub router's
# own SPF (measured: every path ties, and the leaf would ECMP its bulk 50/50 across a 10G and
# a 1G wire).
LEAF_COST_OFFSET=30000

# ---- host as router --------------------------------------------------------------------
# 1 = fabric hosts forward between the zones listed in FORWARD_ALLOW under a generated
#     default-deny nft policy (table inet cfab-fwd). Forwarding is enabled PER INTERFACE,
#     and only after the policy is loaded and read back; a watchdog (`fwd-watchdog`)
#     drops it again if the table disappears.
# 0 = hosts route only for themselves: no policy, no watchdog.
HOST_FORWARD=1
# The admin path is the untagged network on EVERY one of a host's wires (SSH, GUI, DHCP) —
# the lifeline that works with the routing stack stopped. The fabric never owns its L3 state
# (no address flush, no DHCP release), it never transits (the first two policy rules drop
# anything forwarded in or out of any wire), and every wire gets its own HTB band
# (ADMIN_FLOOR) so a bulk zone failing over onto that wire cannot starve an admin session. A
# leaf owns none of this on any wire.
ADMIN_FLOOR=100              # Mb/s minimum for each wire's untagged admin band
ADMIN_BAND=1                 # beside mgmt, between control (0) and bulk (2)
# Allowed forward pairs "from>to"; an unlisted pair is dropped by the policy, and counted.
# Return traffic of an allowed pair is accepted via conntrack (established,related).
FORWARD_ALLOW="storage>storage cluster>cluster mgmt>mgmt"

# ---- marking: the per-zone pcp/dscp live in ZONE_TABLE; these are the CONTROL marks ----
# PCP strategy: mark CONTROL up to its own high queue, leave BULK in the default queue,
# and NEVER mark bulk below the default. On the tested EdgeSwitch-lineage queue map, both
# PCP and DSCP put priority 1 BELOW the default queue; with an all-WRR shared-buffer
# scheduler, dropping a heavy bulk flood down there destabilizes BFD. Control must
# outrank bulk (measured: in-band control flapped BFD in 6 s under a 4.7 Gbit/s flood) —
# the engine sets skb-priority PCP_CTRL on its own OSPF/BFD sockets and the sub-interface
# egress-qos-map turns skb-priority into on-wire PCP, so the lift needs nothing from
# netfilter and works on a kernel without it. Host HTB trees do all bulk differentiation;
# the switch only has to give control its own queue.
PCP_CTRL=6                   # OSPF/BFD control on every zone below it → its own high queue
# DSCP overlay — the plane a DSCP-trusting switch actually queues on. Measured on such a
# switch under a line-rate bulk flood: DSCP-CS6 control at 0% loss / p50 0.24 ms, vs 20%
# loss / 1.79 ms unmarked — own-queue isolation, no strict priority needed. Control and
# the cluster zone go to CS6; storage bulk is clamped to CS0, the default queue — never a
# below-default scavenger queue. Control carries CS6 from the engine's socket; the nft
# table clamps only bulk, and lets OSPF/BFD past that clamp untouched (`return` guards).
# DSCP_MARK=0 rolls this plane back to PCP-only. The host
# HTB floors stay the switch-INDEPENDENT guarantee: a DSCP-blind switch just provides no
# second layer.
DSCP_MARK=1

# ---- shaping: floors/bands/weights live in ZONE_TABLE; link rates in MEMBER_TABLE ------
# One HTB floor+borrow tree per wire, derived from the tables (or a measured cap file)
# and kept current by `shape-daemon`. Floors are MINIMUM guarantees; idle bands lend
# everything (ceil = link). Give a backup-traffic zone floor 0: a backup crawling at a
# slow guaranteed floor that never completes is worse than no backup — floor 0 is a pure
# borrower that starves under contention and takes all surplus when idle.

# BFD detect ≈ rx × mult. Loosen before tightening: measured LAN jitter under saturating
# load can false-flap a 300 ms detect.
BFD_RX_MS=250
BFD_TX_MS=250
BFD_MULT=3                   # ~750 ms detect

# Single-hop BFD port (RFC 5881: 3784). The engine binds it exclusively, so any other BFD
# daemon on the host (FRR's bfdd) makes it refuse to start, naming the holder. Change it only
# to live beside such a daemon, and change it on EVERY member: both ends of a session must
# agree, so this is a fabric-wide contract, not a per-host knob.
BFD_PORT=3784

# OSPF hello/dead = the slow fallback behind BFD
OSPF_HELLO=1
OSPF_DEAD=3

# Ingress (ZONE_TABLE gw): a host tells the router the zone's identities over iBGP — its
# own /32 as a `network`, every identity it can reach via `redistribute ospf` — so the
# router prefers the owner (MED 0) and falls to the cheapest transit (MED = OSPF cost)
# when the owner's segment is gone. The router side is one passive `listen range` in the
# same AS; the host learns nothing from the router (the zone default is the static
# above).
BGP_AS=65000
BGP_KEEPALIVE_S=1
BGP_HOLD_S=3
BGP_CONNECT_S=3              # FRR's default 120 s makes a returned wire re-peer slowly

# USB NICs that need offloads disabled on bringup, as member:dev pairs (scatter-gather
# lockups observed on RTL8157-class adapters under sustained load)
USB_NICS="pve1-tb:eth9 pve2-tb:eth9"

# Runtime state directory: written by `up`, read by `verify` and the daemons
CFAB_RUN=/run/cfab
