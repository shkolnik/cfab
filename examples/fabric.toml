# fabric.toml — the fabric declaration. Everything (sub-interfaces, addressing, OSPF/BFD,
# the nft forward policy, marking, HTB shaping, BGP ingress) is generated from it.
dns_domain = "fabric.example"     # identities are named <member>.<zone>.<dns_domain> (reserved)

# Physical switch domains. The value says what the token physically is: data, not a comment.
[domains]
a = "5G/10G storage switch"
b = "1G switch"
c = "1G admin switch"

# ---- MEMBERS ----------------------------------------------------------------------------
# kind = host (transits, shapes, every wire's untagged path is the admin plane) | leaf (own
# identity + OSPF/BFD, never transits, no shaping, its untagged L3 is not ours).
# Wire order is the fan-out order of the universal (fallback) bond. speed_mbps = DECLARED link
# speed (ethtool is only cross-checked). driver_features = optional `ethtool -K` words.
[[member]]
name = "pve1-tb"
node = 1
kind = "host"
wires = [
# USB adapters: some lock up under sustained load with scatter-gather on (seen on RTL8157).
# Uncomment to run a wire with offloads off; the words go to `ethtool -K <nic>` as written.
#{ nic = "eth9", domain = "a", speed_mbps = 5000, driver_features = "sg off tso off gso off" },
  { nic = "eth9", domain = "a", speed_mbps = 5000 },
  { nic = "eth1", domain = "b", speed_mbps = 1000 },
  { nic = "eth0", domain = "c", speed_mbps = 1000 },
]
# Optional per-zone preference OVERRIDE: COMPLETE wire order for that zone (partial = error).
# prefs = { storage = ["eth1", "eth9", "eth0"] }

[[member]]
name = "pve2-tb"
node = 2
kind = "host"
wires = [
  { nic = "eth9", domain = "a", speed_mbps = 5000 },
  { nic = "eth1", domain = "b", speed_mbps = 1000 },
  { nic = "eth0", domain = "c", speed_mbps = 1000 },
]

[[member]]
name = "pve3-tb"
node = 3
kind = "leaf"
wires = [
  { nic = "eth9", domain = "a", speed_mbps = 10000 },
  { nic = "eth1", domain = "b", speed_mbps = 1000 },
  { nic = "eth0", domain = "c", speed_mbps = 1000 },
]

# ---- ZONES: the traffic classes, each with ITS segments ---------------------------------
# id = OSPF instance, identity netdev cfab-id<id>, block 10.<id>.0.0/16 (not a VLAN id).
# primary = the domain the zone's primary segment lives on (the default producer objective).
# segments = one per domain the zone spans (seg = the segment number, vid = its VLAN id).
# universal = the fallback leg (scope "any"): at most one, an active-backup bond over the
# member's own wires, no BFD. Omit it for a fallback-free zone.
[[zone]]
name = "storage"
id = 99
pcp = 0
dscp = "cs0"
floor_mbps = 2000
band = 2
weight = 4
primary = "a"
segments = [
  { ifname = "cfab-st",    domain = "a", seg = 1, vid = 100 },
  { ifname = "cfab-st-bk", domain = "b", seg = 2, vid = 101 },
  { ifname = "cfab-st-b2", domain = "c", seg = 3, vid = 102 },
]
universal = { ifname = "cfab-st-fb", seg = 9, vid = 300 }

[[zone]]
name = "cluster"
id = 199
pcp = 6
dscp = "cs6"
floor_mbps = 200
band = 0
weight = 1
primary = "b"
segments = [
  { ifname = "cfab-cl",    domain = "b", seg = 1, vid = 200 },
  { ifname = "cfab-cl-bk", domain = "a", seg = 2, vid = 201 },
  { ifname = "cfab-cl-b2", domain = "c", seg = 3, vid = 202 },
]
universal = { ifname = "cfab-cl-fb", seg = 9, vid = 301 }

[[zone]]
name = "mgmt"
id = 249
pcp = 2
dscp = "cs2"
floor_mbps = 100
band = 1
weight = 1
primary = "c"
segments = [
  { ifname = "cfab-mg",    domain = "c", seg = 1, vid = 250 },
  { ifname = "cfab-mg-bk", domain = "b", seg = 2, vid = 251 },
  { ifname = "cfab-mg-b2", domain = "a", seg = 3, vid = 252 },
]
universal = { ifname = "cfab-mg-fb", seg = 9, vid = 302 }
# Where the OUTSIDE enters: a router-owned VLAN distinct from every segment. domain = "any"
# makes the leg migrate (rack precondition applies). Hosts carry the leg; a leaf never does,
# so the outside reaches a leaf at the leaf's own addresses, not at its fabric identity
# (unsupported by design, not a gap).
gw = { domain = "c", vid = 249, router = "192.168.249.254/24" }

# ---- forward: REQUIRED (an omitted table must never decide the isolation posture) --------
[forward]
enabled = true        # hosts transit between zones
allow = ["storage>storage", "cluster>cluster", "mgmt>mgmt"]

# ---- Everything below is a tunable with a measured default; omit a table to take defaults ----
[admin]
floor_mbps = 100      # untagged admin band on every host wire
band = 1              # beside mgmt, between control (0) and bulk (2)

[marking]
pcp_ctrl = 6          # OSPF/BFD control on every zone below it → its own high queue
set_dscp = true

[cost]
leaf_offset = 30000   # a leaf never transits: its paths cost ≥ this above any host path

[bfd]
rx_ms = 250
tx_ms = 250
mult = 3              # ~750 ms detect
port = 3784           # FRR's bfdd default too: declare a free one (13784) on every member
                      # of a fabric whose hosts also run FRR — both ends must agree on it

[ospf]
hello_s = 1
dead_s = 3

[bgp]
asn = 65000
keepalive_s = 1
hold_s = 3
connect_s = 3         # FRR's default 120 s makes a returned wire re-peer slowly

[runtime]
run_dir = "/run/cfab"
